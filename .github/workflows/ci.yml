name: CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Ustawienie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zależności
        run: npm install

      - name: Budowanie projektu
        run: npm run build

      - name: Uruchomienie testów
        run: npm test

      - name: Wdrożenie aplikacji
        run: echo "Wdrażam aplikacje..."
